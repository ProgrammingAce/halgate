services:
  halgate:
    build:
      context: .
      args:
        HALGATE_DATA_DIR: ${HALGATE_DATA_DIR:-/halgate}
        EXTRA_TOOLS: ${EXTRA_TOOLS:-}
    image: ${HALGATE_IMAGE:-halgate:latest}
    # Must match the image user (uid/gid 1000).
    user: "1000:1000"
    stdin_open: true
    tty: true
    environment:
      # config.yaml supports ${VAR} expansion; pass keys in from the shell.
      LLM_API_KEY: ${LLM_API_KEY-}
      # Preserve the host terminal type for Textual keyboard / mouse input.
      TERM: ${TERM:-xterm-256color}
    # HALGATE_DATA_HOST: pick the host-side folder that persists all four
    # state dirs (.halgate_memory, .halgate_audit, .halgate_sessions,
    # .halgate_evidence). To reuse the folders already in the repo root, run
    # with HALGATE_DATA_HOST=.
    volumes:
      - ${HALGATE_DATA_HOST:-./halgate-data}:${HALGATE_DATA_DIR:-/halgate}
      # The app resolves config after CWD at ~/.config/halgate/; scope
      # packages load from the config file's directory. Pre-create the host
      # state folder on podman (docker creates it automatically).
      - ./config.yaml:/home/halgate/.config/halgate/config.yaml:ro
      - ./scope_packages.yaml:/home/halgate/.config/halgate/scope_packages.yaml:ro
    # Override the TUI default per run, e.g.:
    #   docker compose run --rm halgate halgate session list
