# Copy this file to config.yaml and customize it for your local environment.
# Keep credentials in environment variables; do not commit config.yaml.
llm:
  active: "local"
  endpoints:
    - id: "local"
      base_url: "http://127.0.0.1:8080/v1"
      api_key: "${LLM_API_KEY}"
      model: "your-model-name"
      model_context: 100000

# Start with the restrictive package. Review scope_packages.yaml before using
# a different package for an authorized engagement.
scope:
  package: "defensive"

# Initialize encryption with `halgate key init` before enabling forensics.
audit:
  forensic_enabled: false
  encryption_key_file: ".halgate_audit/native-key.json"

# Optional override for an authorized target-reachable callback listener. By
# default, each externally bound listener proposes the source IP selected by
# the OS route to its engagement and asks the operator to approve it. Set this
# only to override that result or when route discovery is unavailable.
# Example: callback: { advertised_host: "192.168.4.67" }
callback: {}

# TUI layout: width of the left chat pane, in percent (clamped to 20-80).
# Adjust live with Ctrl+Shift+[ and Ctrl+Shift+].
tui:
  chat_width_pct: 62
